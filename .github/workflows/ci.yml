name: CI

on:
  push:
  pull_request:

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install aiohttp
      - run: python -m unittest discover -s tests -t . -v

  smoke:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Write a CPU config
        run: printf '[python]\ntorch_index_url = "https://download.pytorch.org/whl/cpu"\n\n[server]\nargs = ["--cpu"]\n' > headless.toml
      - run: python headless.py install
      - run: python headless.py check
      - run: python scripts/smoke_test.py
